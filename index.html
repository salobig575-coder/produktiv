<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Produktiv</title>
<meta name="theme-color" content="#4f7cff">
<meta name="description" content="Aufgaben, Notizen, Fokus-Timer und Gewohnheiten an einem Ort.">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon.svg">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="app">
  <header class="topbar">
    <div>
      <h1 id="pageTitle">Heute</h1>
      <div class="sub" id="pageSub"></div>
    </div>
    <button class="icon-btn" id="settingsBtn" title="Einstellungen">⚙️</button>
  </header>
  <main id="view"></main>
  <nav class="bottomnav">
    <button data-route="today"><span class="ic">🏠</span>Heute</button>
    <button data-route="tasks"><span class="ic">✅</span>Aufgaben</button>
    <button data-route="notes"><span class="ic">📝</span>Notizen</button>
    <button data-route="focus"><span class="ic">⏱️</span>Fokus</button>
    <button data-route="habits"><span class="ic">🔥</span>Habits</button>
  </nav>
</div>

<script src="js/db.js"></script>
<script src="js/app.js"></script>
<script src="js/today.js"></script>
<script src="js/tasks.js"></script>
<script src="js/notes.js"></script>
<script src="js/focus.js"></script>
<script src="js/habits.js"></script>
<script src="js/settings.js"></script>
<script>
  App.init();
</script>
</body>
</html>
